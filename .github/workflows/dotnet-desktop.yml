name: .NET Core API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    # =========================
    # RESTORE
    # =========================
    - name: Restore dependencies
      run: dotnet restore BSEBExamResult_QRGenerate/BSEBExamResult_QRGenerate.csproj

    # =========================
    # BUILD
    # =========================
    - name: Build project
      run: dotnet build BSEBExamResult_QRGenerate/BSEBExamResult_QRGenerate.csproj -c Release --no-restore

    # =========================
    # TEST (optional)
    # =========================
    - name: Run tests
      run: dotnet test BSEBExamResult_QRGenerate/BSEBExamResult_QRGenerate.csproj --no-build --verbosity normal
      continue-on-error: true

    # =========================
    # PUBLISH
    # =========================
    - name: Publish
      run: dotnet publish BSEBExamResult_QRGenerate/BSEBExamResult_QRGenerate.csproj -c Release -o ./publish --no-build

    # =========================
    # ARTIFACT
    # =========================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: ./publish
